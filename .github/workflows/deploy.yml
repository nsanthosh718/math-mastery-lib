# Builds the app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# GitHub Pages requires the repository to be public unless the account is on a
# paid plan, so make the repo public first if it is private.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jsdom (used by the DOM tests) pulls in a version of undici that needs
      # Node 22 — on Node 20 it fails to load with
      # "webidl.util.markAsUncloneable is not a function".
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build must never reach the children's devices.
      - run: npm test

      - run: npm run build

      # Pages serves static files, so a deep link would 404 on refresh. The app
      # is a single page, so serving index.html for unknown paths is correct.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
